yle="stroke:var(--ac)"/><rect x="15" y="26" width="8" height="8" rx="1.5" style="fill:var(--ac)"/><rect x="25.5" y="26" width="3" height="3" rx="0.6" opacity="0.7" style="fill:var(--ac)"/><rect x="30" y="30.5" width="3" height="3" rx="0.6" opacity="0.7" style="fill:var(--ac)"/></g><text x="92" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" style="fill:var(--titulo)">Wallet Loyalty</text><text x="92" y="70" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" style="fill:var(--fraco)">repositório privado</text><rect x="393.62" y="30" width="138.38" height="24" rx="12" fill-opacity="0.12" stroke-opacity="0.45" style="fill:var(--ac);stroke:var(--ac)"/><text x="462.81" y="46.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" style="fill:var(--ac)">piloto · fase 0</text><text x="28" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16.5" style="fill:var(--texto)">Fidelidade na Apple Wallet e no Google Wallet, sem app.</text><text x="28" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16.5" style="fill:var(--texto)">Ledger imutável, outbox transacional, worker em pg-boss.</text><text x="28" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16.5" style="fill:var(--texto)">A Wallet mostra o saldo; quem determina é o backend.</text><rect x="28" y="196" width="97.5" height="26.25" rx="13.12" style="fill:var(--chip-fundo);stroke:var(--chip-borda)"/><text x="76.75" y="213.32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" styl
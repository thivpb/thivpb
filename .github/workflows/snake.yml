# Regenera a cobra que come o gráfico de contribuições do README.
# Sai na branch `output`, que o README lê por raw.githubusercontent.com.
name: snake

on:
  schedule:
    - cron: "0 3 * * *" # meia-noite em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5B841&color_dots=#161B22,#3D2E0F,#7A5612,#C08A1E,#F5B841
            dist/snake-light.svg?palette=github-light&color_snake=#B7791F&color_dots=#EBEDF0,#FBE3B0,#F2C35E,#D9971E,#A86A12

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenera a cobra"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
